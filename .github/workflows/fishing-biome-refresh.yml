name: Refresh Fishing Biome Atlas

on:
  push:
    branches: [fishing-ecology-20260923]
    paths:
      - "tools/build_biome_atlas.py"
      - ".github/workflows/fishing-biome-refresh.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fishing-ecology-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10,<12"
      - name: Rebuild biome atlas
        run: python tools/build_biome_atlas.py
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldseed/assets/biome_atlas.png worldseed/assets/biome_atlas worldseed/assets/biome_catalog.json worldseed/assets/BIOME_ATLAS.md
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Refresh fishing biome atlas"
            git push origin HEAD:fishing-ecology-20260923
          fi

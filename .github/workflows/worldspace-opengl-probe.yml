name: WORLDSEED Native OpenGL Candidate Probe

# Normally manual; scoped bootstrap changes also run once to validate the
# previously observed native context crash. Unrelated graphics changes do not
# trigger this workflow, keeping it outside the regular Fast Gate cost.
# Hosted runner GPUs may be software-backed; always inspect the driver string.
on:
  push:
    branches: [main]
    paths:
      - 'worldseed/presentation/gl_context.py'
      - 'tools/worldseed_gl_diagnostics.py'
  workflow_dispatch:
    inputs:
      width:
        description: "Framebuffer width (640-3840)"
        default: '1280'
        required: true
        type: string
      height:
        description: "Framebuffer height (480-2160)"
        default: '720'
        required: true
        type: string

permissions:
  contents: read
jobs:
  native-worldspace:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install optional shader backend
        shell: pwsh
        run: python -m pip install -e '.[gpu]' 'Pillow>=10,<12'
      - name: Isolate default and explicit context startup diagnostics
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          if ($env:SDL_VIDEODRIVER -eq 'dummy') { Remove-Item Env:SDL_VIDEODRIVER }
          python -u tools/run_ci_check.py --name gl-context-diagnosis --timeout 90 -- python -u -m tools.worldseed_gl_diagnostics --mode compare --timeout 30 --report scratch/gl-context-diagnostics.json
      # The default comparison may reproduce the old native crash. It does not
      # control acceptance: the explicit real render probes below must pass.
      - name: Run actual OpenGL context and framebuffer probe
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          if ($env:SDL_VIDEODRIVER -eq 'dummy') { Remove-Item Env:SDL_VIDEODRIVER }
          python -u tools/run_ci_check.py --name OpenGL-worldspace --timeout 180 -- python -u -m tools.worldspace_opengl_probe --size '${{ inputs.width || '1280' }}x${{ inputs.height || '720' }}' --frames 120 --output scratch/gpu-worldspace-report.json --screenshot scratch/gpu-worldspace-frame.png
      - name: GPU-first forest weather/lighting native visual arena
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          if ($env:SDL_VIDEODRIVER -eq 'dummy') { Remove-Item Env:SDL_VIDEODRIVER }
          python -u tools/run_ci_check.py --name gpu-windows-visual --timeout 220 -- python -u -m tools.worldseed_gpu_playtest --scene forest --size 1280x720 --frames 90 --screenshot scratch/gpu-first-forest.png --report scratch/gpu-first-forest.json

      - name: W1 live snapshot and W2 single-window controlled candidate
        shell: pwsh
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          if ($env:SDL_VIDEODRIVER -eq 'dummy') { Remove-Item Env:SDL_VIDEODRIVER }
          python -u tools/run_ci_check.py --name gpu-live-camp --timeout 120 -- python -u -m tools.worldseed_gpu_gameplay --prepared-scene camp --size 1280x720 --frames 30 --screenshot scratch/gpu-live-camp.png --report scratch/gpu-live-camp.json

      - name: Upload real context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldspace-gl-candidate
          path: |
            scratch/gpu-worldspace-report.json
            scratch/gpu-worldspace-frame.png
            scratch/gpu-first-forest.json
            scratch/gpu-first-forest.png
            scratch/gpu-live-camp.json
            scratch/gpu-live-camp.png
            scratch/*.context.json
            scratch/gl-context-diagnostics*.json
          if-no-files-found: warn

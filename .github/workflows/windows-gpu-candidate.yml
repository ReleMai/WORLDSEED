name: WORLDSEED Windows GPU Main Game Test Build

# Packaging-only changes build once; ordinary gameplay commits use Fast Gate.
# Default EXE launches the persistent main game; legacy entrypoint stays separate.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-gpu-candidate.yml'
      - 'run_worldseed_gpu.py'
      - 'worldseed/ui/gpu_terminal.py'
      - 'worldseed/presentation/gpu_buildings.py'
      - 'worldseed/presentation/gpu_cover_fade.py'
      - 'worldseed/presentation/interior_wall_styles.py'
      - 'worldseed/presentation/interior_wall_art.py'
      - 'tests/test_gpu_view_and_wall_art_regressions.py'
      - 'tests/test_gpu_overhead_and_structural_walls.py'
      - 'worldseed/presentation/gpu_interiors.py'
      - 'worldseed/presentation/interior_art_lighting.py'
      - 'worldseed/presentation/gpu_scene_bridge.py'
      - 'tools/generate_interior_style_sheets.py'
      - 'worldseed/presentation/interior_clip_index.py'
      - 'worldseed/presentation/interior_memory_fade.py'
      - 'worldseed/presentation/gl_worldspace.py'
      - 'worldseed/assets/shaders/worldspace_sprite.frag'
      - 'worldseed/presentation/live_gpu_scene.py'
      - 'worldseed/systems/interior_visibility.py'
      - 'worldseed/systems/interior_state.py'
      - 'worldseed/systems/interiors.py'
      - 'tests/test_gpu_interiors.py'
      - 'tests/test_gpu_house_alignment.py'
      - 'packaging/windows_gpu/**'
      - 'tools/package_gpu_playtest.py'
      - 'tools/smoke_gpu_bundle.py'
      - 'tests/test_gpu_candidate_package.py'

permissions:
  contents: read

jobs:
  windows-gpu-candidate:
    name: Windows x64 GPU main game package and frozen startup smoke
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONFAULTHANDLER: '1'
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install graphics runtime and Windows freezer
        shell: pwsh
        run: python -m pip install -e '.[gpu]' 'Pillow>=10,<12' 'pyinstaller>=6.10,<7'
      - name: Compile and check packaging contracts
        shell: pwsh
        run: |
          python -m compileall -q worldseed tools run_worldseed_gpu.py tests/test_gpu_candidate_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
          python -u tools/run_ci_check.py --name gpu-package-contracts --timeout 90 -- python -u -m unittest -v tests.test_gpu_candidate_package
          if ($LASTEXITCODE -ne 0) { throw 'GPU package contracts failed' }
      - name: Load a real existing world before freezing
        shell: pwsh
        run: |
          python -u tools/run_ci_check.py --name existing-world-load --timeout 150 -- python -u -m unittest -v tests.test_gpu_saved_world_load
          if ($LASTEXITCODE -ne 0) { throw 'Real saved-world load regression failed' }
      - name: Generate four authored interior style sheets for visual feedback
        shell: pwsh
        run: |
          python tools/generate_interior_style_sheets.py --output scratch/interior-art-sheets
          if ($LASTEXITCODE -ne 0) { throw 'Interior art review sheets failed' }
      - name: Build distinct one-directory GPU executable with all engine assets
        shell: pwsh
        run: |
          python -u tools/run_ci_check.py --name freeze-gpu-candidate --timeout 1000 -- python -u tools/package_gpu_playtest.py --build-only --commit '${{ github.sha }}' --output-dir dist
          if ($LASTEXITCODE -ne 0) { throw 'GPU executable build failed' }
      - name: Launch frozen main menu and QA probe; retain honest native driver outcome
        shell: pwsh
        run: |
          if ($env:SDL_VIDEODRIVER -eq 'dummy') { Remove-Item Env:SDL_VIDEODRIVER }
          python -u tools/run_ci_check.py --name frozen-gpu-smoke --timeout 400 -- python -u tools/smoke_gpu_bundle.py dist/WORLDSEED_GPU/WORLDSEED_GPU.exe --output-dir scratch/gpu-bundle-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Actual frozen executable smoke failed' }
      - name: Record smoke distinction and verify final ZIP
        shell: pwsh
        run: |
          Copy-Item scratch/gpu-bundle-smoke/SMOKE_RESULT.json dist/WORLDSEED_GPU/SMOKE_RESULT.json
          python -u tools/package_gpu_playtest.py --archive-only --commit '${{ github.sha }}' --output-dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Final package verification failed' }
      - name: Upload self-contained executable candidate
        uses: actions/upload-artifact@v4
        with:
          name: WORLDSEED-Windows-GPU-CANDIDATE-${{ github.sha }}
          path: dist/WORLDSEED_GPU/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Upload separate interior art style sheets
        uses: actions/upload-artifact@v4
        with:
          name: WORLDSEED-Interior-Art-Sheets-${{ github.sha }}
          path: scratch/interior-art-sheets/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload context and executable smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WORLDSEED-GPU-Build-Evidence-${{ github.sha }}
          path: |
            scratch/gpu-bundle-smoke/
            dist/*.zip.sha256
          if-no-files-found: warn
          retention-days: 30

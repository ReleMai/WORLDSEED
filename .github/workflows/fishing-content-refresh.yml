name: Refresh Fishing Content

on:
  push:
    branches: [fishing-ecology-20260923]
    paths:
      - "tools/build_fishing_assets.py"
      - "tools/build_sprite_atlases.py"
      - "tools/build_biome_atlas.py"
      - "worldseed/data/items.json"
      - "worldseed/data/resources.json"
      - "worldseed/data/species.json"
      - "worldseed/data/fish.json"
      - "worldseed/assets/visuals.json"
      - ".github/workflows/fishing-content-refresh.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fishing-ecology-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Build fishing and ecology sprites
        run: python tools/build_fishing_assets.py
      - name: Rebuild item atlas
        run: python tools/build_sprite_atlases.py --items-only
      - name: Rebuild biome atlas
        run: python tools/build_biome_atlas.py
      - name: Commit generated content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldseed/assets/sprites/items worldseed/assets/sprites/resources worldseed/assets/sprites/species
          git add worldseed/assets/atlases/items.png worldseed/assets/atlas_index.json worldseed/assets/item_catalog.png worldseed/assets/ITEM_ATLAS.md
          git add worldseed/assets/biome_atlas.png worldseed/assets/biome_atlas worldseed/assets/biome_catalog.json worldseed/assets/BIOME_ATLAS.md
          if git diff --cached --quiet; then
            echo "No generated content changes."
          else
            git commit -m "Build fishing ecology assets and atlases"
            git push origin HEAD:fishing-ecology-20260923
          fi

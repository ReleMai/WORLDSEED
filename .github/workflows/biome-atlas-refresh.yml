name: Refresh Biome Atlas

on:
  push:
    branches: [biome-atlas-20260923]
    paths:
      - "tools/build_biome_atlas.py"
      - ".github/workflows/biome-atlas-refresh.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: biome-atlas-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Build biome atlas
        run: python tools/build_biome_atlas.py
      - name: Commit generated biome atlas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldseed/assets/biome_atlas.png worldseed/assets/biome_atlas/ worldseed/assets/biome_catalog.json worldseed/assets/BIOME_ATLAS.md
          if git diff --cached --quiet; then
            echo "No generated biome atlas changes."
          else
            git commit -m "Build detailed biome atlas cards"
            git push origin HEAD:biome-atlas-20260923
          fi

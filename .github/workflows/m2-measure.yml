name: WORLDSEED M2 Performance Measurements

# One-off reproducible profiling after an M2 benchmark-script/workflow update.
# Not part of every normal Fast Gate run, since reference scenes are expensive.
on:
  push:
    branches: [main]
    paths:
      - "tools/m2_validation.py"
      - ".github/workflows/m2-measure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m2-measure:
    name: M2 reference scenes and save-capture scaling
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: python -m pip install -e . "Pillow>=10,<12"
      - name: Run six scenes, distant scaling and save capture
        run: python -u tools/run_ci_check.py --name "M2 performance measurement" --timeout 870 -- python -u -m tools.m2_validation --output dist/m2-validation --frames 40 --warmup 5 --capture-repeats 3
      - name: Preserve machine-readable measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-m2-measurements
          path: dist/m2-validation/
          if-no-files-found: warn
          retention-days: 30

  m2-fullhd:
    name: M2 1080p reference scenes (synthetic headless)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: python -m pip install -e . "Pillow>=10,<12"
      - name: Measure six 1080p reference scenes
        run: python -u tools/run_ci_check.py --name "M2 1080p references" --timeout 600 -- python -u -m tools.reference_scenes --scene all --headless --frames 40 --warmup 5 --width 1920 --height 1080 --zoom 28 --output-dir dist/m2-fullhd
      - name: Preserve full-resolution scene results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-m2-1080p
          path: dist/m2-fullhd/
          if-no-files-found: warn
          retention-days: 30

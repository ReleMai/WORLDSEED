name: Refresh Item Atlas

on:
  push:
    branches: [item-taxonomy-refine-20260923]
    paths:
      - "worldseed/data/items.json"
      - "worldseed/assets/sprites/items/**"
      - "tools/build_sprite_atlases.py"
      - ".github/workflows/item-atlas-refresh.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: item-taxonomy-refine-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Rebuild item atlas and catalog
        run: python tools/build_sprite_atlases.py --items-only
      - name: Commit generated atlas files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldseed/assets/atlases/items.png worldseed/assets/atlas_index.json worldseed/assets/item_catalog.png worldseed/assets/ITEM_ATLAS.md
          if git diff --cached --quiet; then
            echo "No generated atlas changes."
          else
            git commit -m "Rebuild refined item atlas"
            git push origin HEAD:item-taxonomy-refine-20260923
          fi

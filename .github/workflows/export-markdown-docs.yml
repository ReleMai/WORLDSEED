name: Consolidate Markdown Docs

on:
  push:
    branches:
      - docs/consolidate-markdown-20260922

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build consolidated README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          keep = Path("AGENTS.md")
          readme = Path("README.md")
          docs = sorted(
              p for p in root.rglob("*.md")
              if ".git" not in p.parts and p != keep
          )

          def category(path: Path) -> int:
              name = path.name
              if path == readme:
                  return 0
              if "ROADMAP" in name or "IMPLEMENTATION_PLAN" in name:
                  return 1
              if any(x in name for x in (
                  "SYSTEMS", "ARCHITECTURE", "UI_GUIDE", "MODDING",
                  "STYLE_GUIDE", "EARLY_GAME", "BALANCE", "ECONOMY",
                  "REGIONAL_TERRAIN_ASSETS", "UI_RESEARCH"
              )):
                  return 2
              if any(x in name for x in (
                  "RELEASE_NOTES", "CHANGELOG", "COMPLETION_REPORT", "REPORT"
              )):
                  return 3
              if any(x in name for x in ("VALIDATION", "CHECKLIST", "TRIGGER")):
                  return 4
              if any(x in name for x in ("HANDOFF", "PROGRESS", "BASELINE")):
                  return 5
              return 6

          labels = {
              0: "Current Project Overview",
              1: "Roadmaps and Plans",
              2: "Systems, Design, UI, Modding, and Art Guides",
              3: "Release Notes and Completion Reports",
              4: "Validation and Test Records",
              5: "Development Handoffs and Progress Records",
              6: "Additional Project Notes",
          }
          docs.sort(key=lambda p: (category(p), p.as_posix().lower()))

          out = [
              "# WORLDSEED — Consolidated Project Manual",
              "",
              "This README is the single consolidated human-facing Markdown document for WORLDSEED. "
              "It absorbs the previous roadmap, system, design, validation, handoff, audit, report, "
              "release-note, UI, art, and development-history Markdown files so the repository stays clean.",
              "",
              "> **Operational exception:** `AGENTS.md` remains separate because coding agents and "
              "automation discover repository instructions by that filename. It is operational configuration, "
              "not a second project manual.",
              "",
              "## Documentation Index",
              "",
          ]

          for cat in range(7):
              rows = [p for p in docs if category(p) == cat]
              if rows:
                  out.append(f"- **{labels[cat]}** — {len(rows)} source document" + ("" if len(rows) == 1 else "s"))

          out += [
              "",
              "## Legacy Source Map",
              "",
              "The original filenames are preserved as section labels below. Older notes that say "
              "“see `SOME_FILE.md`” now refer to the matching **Source: `SOME_FILE.md`** section here.",
              "",
          ]

          for cat in range(7):
              rows = [p for p in docs if category(p) == cat]
              if not rows:
                  continue
              out += ["---", "", f"# {labels[cat]}", ""]
              for p in rows:
                  content = p.read_text(encoding="utf-8").strip()
                  out += ["---", "", f"## Source: `{p.as_posix()}`", "", content, ""]

          readme.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8")

          for p in docs:
              if p != readme and p.exists():
                  p.unlink()

          package = Path("tools/package_dev15.py")
          text = package.read_text(encoding="utf-8")
          old = "'DEV15_VALIDATION.md'"
          if old not in text:
              raise SystemExit("Expected DEV15 validation packaging reference was not found")
          package.write_text(text.replace(old, "'README.md'"), encoding="utf-8")

          workflow = Path(".github/workflows/export-markdown-docs.yml")
          if workflow.exists():
              workflow.unlink()

          remaining = sorted(p.as_posix() for p in root.rglob("*.md") if ".git" not in p.parts)
          if remaining != ["AGENTS.md", "README.md"]:
              raise SystemExit(f"Unexpected Markdown files remain: {remaining}")

          print(f"Consolidated {len(docs)} human-facing Markdown files into README.md")
          print("Remaining Markdown:", ", ".join(remaining))
          PY

      - name: Validate cleanup
        run: |
          python -m py_compile tools/package_dev15.py
          test "$(find . -type f -name '*.md' -not -path './.git/*' | wc -l)" -eq 2
          grep -q "Source: `WORLDGEN_V8_ROADMAP.md`" README.md
          grep -q "Source: `CHANGELOG.md`" README.md
          grep -q "Source: `UI_GUIDE.md`" README.md

      - name: Commit consolidation
        run: |
          git config user.name "WORLDSEED Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Markdown documentation into README"
          git push origin HEAD:docs/consolidate-markdown-20260922

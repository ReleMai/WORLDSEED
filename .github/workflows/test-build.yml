name: WORLDSEED Full Validation & Package

# Intentionally manual. The comprehensive suite is expensive and is a
# release/handoff gate, not something to run after every development commit.
on:
  workflow_dispatch:

concurrency:
  group: worldseed-full-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WORLDSEED
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "Pillow>=10,<12"

      - name: Compile Python
        shell: pwsh
        run: python -m compileall worldseed

      # Keep cheap/high-signal regressions before the expensive worldgen suite
      # so interface or compatibility mistakes fail in seconds, not ~15 minutes.
      - name: Run graphical inventory and storage UI regressions
        shell: pwsh
        run: python -m unittest tests.test_dev19_feature_ui tests.test_dev21_mouse_ui tests.test_dev34_storage_containers tests.test_dev37_floating_interaction_ui tests.test_dev38_natural_container_art tests.test_dev38_natural_container_visuals

      - name: Run Phase 5 coast regression tests
        shell: pwsh
        run: python -m unittest tests.test_worldgen_v8_coast

      - name: Run atlas interaction regression
        shell: pwsh
        run: python -m unittest tests.test_dev22_atlas.AtlasRenderTests.test_render_controls_resize_hover_and_assets

      - name: Run Dev31 playtest regressions
        shell: pwsh
        run: python -m unittest tests.test_dev31_playtest_fixes

      - name: Run v8 worldgen and hydrology regression suite
        shell: pwsh
        run: python -m unittest tests.test_rc14_hydrology tests.test_worldgen_v8_climate_weather tests.test_worldgen_v8_phase2 tests.test_worldgen_v8_topography tests.test_worldgen_v8_promotion tests.test_rc13_pregeneration

      - name: Run content and visual audits
        shell: pwsh
        run: |
          python tools/audit_content.py
          python tools/audit_visuals.py

      - name: Run Phase 5 coast morphology audit
        shell: pwsh
        run: python tools/audit_worldgen_v8_coast.py --seeds 4 --radius 2048 --step 128

      - name: Run Hydrology v2 morphology audit
        shell: pwsh
        run: |
          python tools/audit_hydrology.py --seed v8-dev30-test-build
          python tools/audit_hydrology_morphology.py --seed v8-dev30-test-build --domain-x 0 --domain-y 0

      - name: Generate mountain test locations
        shell: pwsh
        run: python tools/find_dev31_test_locations.py --seed dev31-mountain-test --out DEV31_TEST_LOCATIONS.json

      - name: Build clean test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $exclude = @(".git", ".github", "package", "__pycache__", ".pytest_cache", ".mypy_cache", "saves", "backups")
          Get-ChildItem -Force | Where-Object { $exclude -notcontains $_.Name } | ForEach-Object {
            Copy-Item $_.FullName -Destination package -Recurse -Force
          }
          Get-ChildItem package -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Get-ChildItem package -Recurse -File -Include "*.pyc","*.pyo" | Remove-Item -Force

      - name: Upload playable validated build
        uses: actions/upload-artifact@v4
        with:
          name: WORLDSEED_RC14_VALIDATED_BUILD
          path: package/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

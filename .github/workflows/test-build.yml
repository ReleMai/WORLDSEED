name: WORLDSEED Full Validation & Package

# Normally manual: the comprehensive suite is a release/handoff gate, not
# something to run after every development commit. A PR that changes this
# workflow also runs it so validation/package maintenance can prove itself.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/test-build.yml"
  workflow_dispatch:

concurrency:
  group: worldseed-full-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WORLDSEED
        shell: pwsh
        timeout-minutes: 3
        run: python -m pip install -e . "Pillow>=10,<12"

      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q worldseed tools tests

      - name: Run complete regression suite once
        shell: pwsh
        run: python -u tools/run_ci_check.py --name full-regressions --timeout 1200 -- python -u -m unittest discover -s tests -v -f

      - name: Run content audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name content-audit --timeout 90 -- python -u tools/audit_content.py

      - name: Run visual audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name visual-audit --timeout 90 -- python -u tools/audit_visuals.py

      - name: Run Phase 5 coast morphology audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name coast-audit --timeout 600 -- python -u tools/audit_worldgen_v8_coast.py --seeds 4 --radius 2048 --step 128

      - name: Run Hydrology v2 domain audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name hydrology-domain-audit --timeout 600 -- python -u tools/audit_hydrology.py --seed v8-dev30-test-build

      - name: Run Hydrology v2 morphology audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name hydrology-morphology-audit --timeout 600 -- python -u tools/audit_hydrology_morphology.py --seed v8-dev30-test-build --domain-x 0 --domain-y 0

      - name: Generate mountain test locations
        shell: pwsh
        run: python -u tools/run_ci_check.py --name mountain-locations --timeout 300 -- python -u tools/find_dev31_test_locations.py --seed dev31-mountain-test --out DEV31_TEST_LOCATIONS.json

      - name: Build clean test package
        shell: pwsh
        run: |
          git archive --format=zip --output="$env:RUNNER_TEMP/source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw "git archive failed" }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/source.zip" -DestinationPath package
          Copy-Item DEV31_TEST_LOCATIONS.json -Destination package -Force

      - name: Upload playable validated build
        uses: actions/upload-artifact@v4
        with:
          name: WORLDSEED_RC14_VALIDATED_BUILD
          path: package/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      # Keep running diagnostic checks even after a failed assertion, but never
      # mark this job green unless every individual smoke check passed.
      - name: Enforce world smoke results
        if: ${{ always() }}
        shell: pwsh
        env:
          WORLD_SMOKE_STEPS: ${{ toJSON(steps) }}
        run: |
          $results = $env:WORLD_SMOKE_STEPS | ConvertFrom-Json
          $failed = @($results.PSObject.Properties | Where-Object { $_.Value.outcome -eq 'failure' } | ForEach-Object { $_.Name })
          if ($failed.Count) {
            Write-Error ("World smoke regressions failed: " + ($failed -join ', '))
            exit 1
          }

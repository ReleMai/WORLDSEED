name: WORLDSEED Fast Gate

# This is the only normal automatic CI path. It is intentionally bounded so
# a development mistake is caught in a few minutes without launching the
# expensive full release suite for every commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - ".github/workflows/package-test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - ".github/workflows/package-test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: worldseed-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WORLDSEED
        shell: pwsh
        timeout-minutes: 3
        run: python -m pip install -e . "Pillow>=10,<12"

      - name: Verify CI diagnostics and asset decoder
        shell: pwsh
        run: python -u tools/run_ci_check.py --name diagnostics-tests --timeout 60 -- python -u -m unittest -v tests.test_ci_diagnostics

      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q worldseed tools tests

      - name: Settlement economy property crime stealth security and civic regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Settlement economy property crime stealth security and civic regressions" --timeout 300 -- python -u -m unittest -v tests.test_settlement_generation_foundation tests.test_settlement_population_bindings tests.test_civic_economy_social tests.test_economy_routines_transactions tests.test_physical_property_crime_profile tests.test_building_stealth tests.test_property_storage_casing

      - name: Item asset catalog regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Item asset catalog regressions" --timeout 90 -- python -u -m unittest -v tests.test_item_asset_catalog

      - name: Biome atlas regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Biome atlas regressions" --timeout 90 -- python -u -m unittest -v tests.test_biome_atlas

      - name: Fishing system regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Fishing system regressions" --timeout 90 -- python -u -m unittest -v tests.test_fishing_system

      - name: Combat and hunting regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Combat and hunting regressions" --timeout 90 -- python -u -m unittest -v tests.test_combat_hunting_phase tests.test_combat_shields_arena tests.test_combat_spacing tests.test_hunting_stealth_anatomy tests.test_ui_rc2.UIRC2Tests.test_combat_action_hub_exposes_active_defense_without_new_global_keys

      - name: Dev34 inventory and storage regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev34 inventory and storage regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev34_storage_containers

      - name: Dev36 world interaction regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev36 world interaction regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev36_world_interactions

      - name: Dev37 floating interaction UI regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev37 floating interaction UI regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev37_floating_interaction_ui

      - name: Crafting discovery pot regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Crafting discovery pot regressions" --timeout 120 -- python -u -m unittest -v tests.test_crafting_pot_ui tests.test_dev16_caves_crafting.Dev16CraftDiscoveryTests

      - name: Dev38 natural container art regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev38 natural container art regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev38_natural_container_art

      - name: Dev38 natural container visual regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev38 natural container visual regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev38_natural_container_visuals

      - name: Phase 5 coast tests
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Phase 5 coast tests" --timeout 240 -- python -u -m unittest -v tests.test_worldgen_v8_coast tests.test_coastal_mouths tests.test_terrain_performance tests.test_terrain_variants

      - name: Surface-cache and save-compatibility smoke tests
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Surface-cache and save-compatibility smoke tests" --timeout 120 -- python -u -m unittest -v tests.test_rc13_pregeneration tests.test_rc14_hydrology.RC14HydrologyTests.test_surface_chunk_cache_isolated_by_hydrology_and_morphology_contract tests.test_rc14_hydrology.RC14HydrologyTests.test_legacy_save_open_adds_contract_metadata_without_geography_rewrite

      - name: Atlas UI regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Atlas UI regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev22_atlas.AtlasRenderTests.test_render_controls_resize_hover_and_assets tests.test_settlement_atlas_ui

      - name: Content audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name content-audit --timeout 90 -- python -u tools/audit_content.py

      - name: Visual audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name visual-audit --timeout 90 -- python -u tools/audit_visuals.py

      - name: Bounded coast morphology audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name coast-audit --timeout 180 -- python -u tools/audit_worldgen_v8_coast.py --seeds 3 --radius 1536 --step 128

      - name: Coastal mouths audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name coastal-mouths-audit --timeout 180 -- python -u tools/audit_coastal_mouths.py --seeds 3

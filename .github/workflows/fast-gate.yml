name: WORLDSEED Fast Gate

# This is the only normal automatic CI path. It is intentionally bounded so
# a development mistake is caught in a few minutes without launching the
# expensive full release suite for every commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - ".github/workflows/package-test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - ".github/workflows/package-test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: worldseed-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-runner-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "Pillow>=10,<12"
      - name: Verify process deadlines on Linux
        run: python -u tools/run_ci_check.py --name linux-runner --timeout 45 -- python -u -m unittest -v tests.test_ci_diagnostics

  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WORLDSEED
        shell: pwsh
        timeout-minutes: 3
        run: python -m pip install -e . "Pillow>=10,<12"

      - name: Verify CI diagnostics and asset decoder
        shell: pwsh
        run: python -u tools/run_ci_check.py --name diagnostics-tests --timeout 60 -- python -u -m unittest -v tests.test_ci_diagnostics tests.test_development_workflow tests.test_craftable_sprite_coverage tests.test_dev20_graphical_regressions.GraphicalAssetTests

      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q worldseed tools tests

      - name: Log cabin blueprint and placement ghost
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Log cabin blueprint and ghost" --timeout 60 -- python -u -m unittest -v tests.test_homestead_blueprints tests.test_homestead_ghost_ui

      - name: Dev41 realtime and free-movement regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev41 realtime and free movement" --timeout 90 -- python -u -m unittest -v tests.test_social_realtime_phase tests.test_dialogue_movement_phase tests.test_free_movement

      - name: Dev60 deterministic dialogue trees and nested text UI
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev60 conversations" --timeout 90 -- python -u -m unittest -v tests.test_dialogue_trees tests.test_dialogue_context tests.test_dialogue_tree_ui tests.test_dialogue_tree_navigation

      - name: Dev61 paused conversations and composite portraits
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev61 conversation portraits" --timeout 90 -- python -u -m unittest -v tests.test_conversation_pause tests.test_npc_portraits tests.test_conversation_portrait_ui tests.test_dev61_conversation_integration

      - name: Dev62 expanded portrait layers and version compatibility
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev62 portrait expansion" --timeout 90 -- python -u -m unittest -v tests.test_portrait_expansion tests.test_portrait_version_persistence

      - name: Living NPC routines equipment and action combat
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Living NPCs and action combat" --timeout 180 -- python -u -m unittest -v tests.test_npc_schedules tests.test_npc_schedule_integration tests.test_npc_living_routines tests.test_npc_equipment tests.test_npc_living_ui tests.test_action_combat tests.test_npc_production_economy tests.test_npc_job_lab

      - name: Settlement economy property crime stealth security and civic regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Settlement economy property crime stealth security and civic regressions" --timeout 300 -- python -u -m unittest -v -f tests.test_territory_claims tests.test_regional_transport_phase3 tests.test_regional_transport_phase2 tests.test_settlement_generation_foundation tests.test_settlement_profession_yards tests.test_settlement_population_bindings tests.test_dev43_settlement_diversity tests.test_dev45_farm_compounds tests.test_regional_civilization_routes tests.test_civic_economy_social tests.test_economy_routines_transactions tests.test_phase4_activities tests.test_phase4_miners tests.test_phase4_professions tests.test_phase4_workshop_expansion tests.test_physical_property_crime_profile tests.test_building_stealth tests.test_property_storage_casing tests.test_household_economy tests.test_workplace_logistics

      - name: Dev64 item art and database regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev64 item art and database regressions" --timeout 90 -- python -u -m unittest -v tests.test_item_asset_catalog tests.test_item_database tests.test_generated_item_icons

      - name: Functional home furniture, storage and homestead blueprints
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Functional furniture" --timeout 90 -- python -u -m unittest -v tests.test_functional_furniture tests.test_indoor_building_storage tests.test_dev50_interior_storage tests.test_dev50_storage_ui tests.test_interior_workstation_ui tests.test_homestead_blueprints

      - name: Audit every building facade
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Building asset geometry" --timeout 90 -- python -u tools/audit_building_assets.py --output dist/building-audit

      - name: Biome atlas regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Biome atlas regressions" --timeout 90 -- python -u -m unittest -v tests.test_biome_atlas

      - name: Fishing system regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Fishing system regressions" --timeout 90 -- python -u -m unittest -v tests.test_fishing_system

      - name: Combat and hunting regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Combat and hunting regressions" --timeout 90 -- python -u -m unittest -v tests.test_combat_hunting_phase tests.test_combat_shields_arena tests.test_combat_spacing tests.test_hunting_stealth_anatomy tests.test_ui_rc2.UIRC2Tests.test_combat_action_hub_exposes_active_defense_without_new_global_keys

      - name: Dev34 inventory and storage regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev34 inventory and storage regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev34_storage_containers

      - name: Dev36 world interaction regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev36 world interaction regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev36_world_interactions

      - name: Dev37 floating interaction UI regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev37 floating interaction UI regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev37_floating_interaction_ui

      - name: WU7 village stability and debugger regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "WU7 village stability and debugger regressions" --timeout 90 -- python -u -m unittest -v tests.test_wu7_village_stability_debug

      - name: Dev31 world-startup playtest regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev31 world-startup playtest regressions" --timeout 180 -- python -u -m unittest -v tests.test_dev31_playtest_fixes

      - name: Dev42 normalized character art regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev42 normalized character art regressions" --timeout 90 -- python -u -m unittest -v tests.test_character_sprite_normalization tests.test_npc_sex tests.test_dev20_graphical_regressions.GraphicalAssetTests

      - name: Dev43 domestic animal art regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev43 domestic animal art regressions" --timeout 90 -- python -u -m unittest -v tests.test_animal_sprites

      - name: Dev44 stance dialogue and respawn regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev44 interaction regressions" --timeout 90 -- python -u -m unittest -v tests.test_dev44_stance_dialogue_respawn tests.test_ui_rc2.AggressiveStanceRoutingTests

      - name: Dev46 continuous interior regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev46 interiors" --timeout 180 -- python -u -m unittest -v tests.test_interiors tests.test_interior_engine tests.test_interior_ai tests.test_interior_knocking tests.test_interior_presentation tests.test_interior_projection

      - name: Dev47-48 building shell and differentiated interior regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev47-48 buildings" --timeout 180 -- python -u -m unittest -v tests.test_building_shells tests.test_building_interior_profiles tests.test_building_presentation tests.test_exterior_pointer_routing tests.test_interior_materials tests.test_interior_workstation_ui tests.test_interior_security tests.test_interior_work tests.test_interior_activity_validation tests.test_dev47_building_context tests.test_ui_rc2.AggressiveStanceRoutingTests

      - name: Dev49 production layouts and civilization siting
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev49 production layouts" --timeout 180 -- python -u -m unittest -v tests.test_settlement_layouts tests.test_dev49_production_layouts tests.test_dev49_civilization_siting

      - name: Dev50 access storage and introductions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev50 settlement polish" --timeout 180 -- python -u -m unittest -v tests.test_dev50_settlement_access tests.test_dev50_interior_storage tests.test_dev50_npc_introductions tests.test_dev50_presentation tests.test_dev50_storage_ui

      - name: Dev51 furnished floors and Stalk theft
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev51 furnished interiors" --timeout 180 -- python -u -m unittest -v tests.test_dev51_furnishing tests.test_dev51_interior_floors tests.test_dev51_interior_pointer tests.test_dev51_stalk_theft

      - name: Dev52 authored building and furnishing content
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev52 authored content" --timeout 180 -- python -u -m unittest -v tests.test_dev52_building_variants tests.test_dev52_furniture_content tests.test_dev52_exterior_alignment

      - name: Dev53-54 furnishing lighting HUD and building footprint fit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev53-54 interiors and exterior fit" --timeout 180 -- python -u -m unittest -v tests.test_dev53_furnishing_slots tests.test_dev53_lighting tests.test_dev53_interior_ui tests.test_dev53_decoration tests.test_dev54_exterior_fit tests.test_dev54_building_access

      - name: Crafting discovery pot regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Crafting discovery pot regressions" --timeout 120 -- python -u -m unittest -v tests.test_crafting_pot_ui tests.test_dev16_caves_crafting.Dev16CraftDiscoveryTests

      - name: Dev63 salvaging and profession expansion
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev63 salvaging and profession expansion" --timeout 180 -- python -u -m unittest -v tests.test_salvaging tests.test_salvaging_ui tests.test_salvage_tabletop_art tests.test_crafting_water tests.test_crafting_expansion tests.test_crafting_expansion_economy tests.test_dev63_salvage_loot

      - name: Dev38 natural container art regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev38 natural container art regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev38_natural_container_art

      - name: Dev38 natural container visual regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Dev38 natural container visual regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev38_natural_container_visuals

      - name: Phase 5 coast tests
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Phase 5 coast tests" --timeout 240 -- python -u -m unittest -v tests.test_worldgen_v8_coast tests.test_coastal_mouths tests.test_terrain_performance tests.test_terrain_variants

      - name: Surface-cache and save-compatibility smoke tests
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Surface-cache and save-compatibility smoke tests" --timeout 120 -- python -u -m unittest -v tests.test_rc13_pregeneration tests.test_rc14_hydrology.RC14HydrologyTests.test_surface_chunk_cache_isolated_by_hydrology_and_morphology_contract tests.test_rc14_hydrology.RC14HydrologyTests.test_legacy_save_open_adds_contract_metadata_without_geography_rewrite

      - name: Atlas UI regressions
        shell: pwsh
        run: python -u tools/run_ci_check.py --name "Atlas UI regressions" --timeout 120 -- python -u -m unittest -v tests.test_dev22_atlas.AtlasRenderTests.test_render_controls_resize_hover_and_assets tests.test_settlement_atlas_ui

      - name: Content audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name content-audit --timeout 90 -- python -u tools/audit_content.py

      - name: Visual audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name visual-audit --timeout 90 -- python -u tools/audit_visuals.py

      - name: Bounded coast morphology audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name coast-audit --timeout 180 -- python -u tools/audit_worldgen_v8_coast.py --seeds 3 --radius 1536 --step 128

      - name: Coastal mouths audit
        shell: pwsh
        run: python -u tools/run_ci_check.py --name coastal-mouths-audit --timeout 180 -- python -u tools/audit_coastal_mouths.py --seeds 3

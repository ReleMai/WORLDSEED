name: WORLDSEED Fast Gate

# This is the only normal automatic CI path. It is intentionally bounded so
# a development mistake is caught in a few minutes without launching the
# expensive full release suite for every commit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fast-gate.yml"
      - ".github/workflows/test-build.yml"
      - "worldseed/**"
      - "tests/**"
      - "tools/**"
      - "run_worldseed.py"
      - "RUN_WORLDSEED.bat"
      - "RUN_WORLDSEED_TERMINAL.bat"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: worldseed-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install WORLDSEED
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "Pillow>=10,<12"

      - name: Compile Python
        shell: pwsh
        run: python -m compileall worldseed

      - name: Dev34 inventory and storage regressions
        shell: pwsh
        run: python -m unittest tests.test_dev34_storage_containers

      - name: Dev36 world interaction regressions
        shell: pwsh
        run: python -m unittest tests.test_dev36_world_interactions

      - name: Dev37 floating interaction UI regressions
        shell: pwsh
        run: python -m unittest tests.test_dev37_floating_interaction_ui

      - name: Dev38 natural container art regressions
        shell: pwsh
        run: python -m unittest tests.test_dev38_natural_container_art

      - name: Dev38 natural container visual regressions
        shell: pwsh
        run: python -m unittest tests.test_dev38_natural_container_visuals

      - name: Phase 5 coast tests
        shell: pwsh
        run: python -m unittest tests.test_worldgen_v8_coast tests.test_coastal_mouths tests.test_terrain_performance tests.test_terrain_variants

      - name: Surface-cache and save-compatibility smoke tests
        shell: pwsh
        run: python -m unittest tests.test_rc13_pregeneration tests.test_rc14_hydrology.RC14HydrologyTests.test_surface_chunk_cache_isolated_by_hydrology_and_morphology_contract tests.test_rc14_hydrology.RC14HydrologyTests.test_legacy_save_open_adds_contract_metadata_without_geography_rewrite

      - name: Atlas drag regression
        shell: pwsh
        run: python -m unittest tests.test_dev22_atlas.AtlasRenderTests.test_render_controls_resize_hover_and_assets

      - name: Content and visual audits
        shell: pwsh
        run: |
          python tools/audit_content.py
          python tools/audit_visuals.py

      - name: Bounded coast morphology audit
        shell: pwsh
        run: |
          python tools/audit_worldgen_v8_coast.py --seeds 3 --radius 1536 --step 128
          python tools/audit_coastal_mouths.py --seeds 3
